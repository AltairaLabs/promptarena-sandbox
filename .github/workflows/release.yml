name: Release

# Runs on `v*` tags (e.g. v0.1.0) and publishes:
#   - ghcr.io/altairalabs/promptarena-sandbox:<tag>
#   - ghcr.io/altairalabs/promptarena-sandbox:latest
#
# Multi-arch: linux/amd64 + linux/arm64.
#
# New GHCR packages start PRIVATE. After the first release, an org owner
# must flip package visibility to public in the package settings — this
# workflow cannot do that itself.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: "Manual tag override (when testing via workflow_dispatch)"
        required: false
        default: "latest"

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/altairalabs/promptarena-sandbox

jobs:
  publish:
    name: Build + push multi-arch image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tag
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "value=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      # The Dockerfile pins its own `FROM ghcr.io/altairalabs/codegen-sandbox
      # @sha256:...` base by digest (bumped deliberately, not tied to this
      # release's tag), so this build needs no build-contexts wiring — it
      # just builds and pushes standalone.
      - name: Build + push image (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.value }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
